name: keitaro-campaigns

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-keitaro}
      POSTGRES_USER: ${POSTGRES_USER:-keitaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-https://keitaro-for-tests.etolegko.com/admin_api/v1}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      KEITARO_DOMAIN_ID: ${KEITARO_DOMAIN_ID:-1813}
      KEITARO_GROUP_ID: ${KEITARO_GROUP_ID:-10332}
      KEITARO_TRAFFIC_SOURCE_ID: ${KEITARO_TRAFFIC_SOURCE_ID:-836}
      KEITARO_TIMEOUT: ${KEITARO_TIMEOUT:-15}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keitaro}
      POSTGRES_USER: ${POSTGRES_USER:-keitaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
